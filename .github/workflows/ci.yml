name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test -c Release
      - name: Publish
        run: dotnet publish src/NfcDesk.App -c Release -r win-x64 -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: NFCDesk-win-x64
          path: publish/NFCDesk.exe
