name: Publish site to gh-pages

# GitHub Pages serves the gh-pages branch (enabled automatically when the
# branch was first pushed). This workflow copies site/ onto that branch
# whenever it changes on main. Only the default GITHUB_TOKEN is needed.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push site/ to gh-pages
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          cp -r site/. "$out/"
          cd "$out"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
